<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Almoxarifado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Estoque</h1>
            <p>SENAC - Cuiabá</p>
        </header>

        <div class="card">
            <h2>Registrar Movimentação</h2>
            <form id="estoqueForm">
                <div class="form-group">
                    <label for="tipoAcao">Tipo de Operação:</label>
                    <select id="tipoAcao" required>
                        <option value="saida">Saída de Material</option>
                        <option value="entrada">Entrada de Material</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="codigoSelect">Selecione o Produto:</label>
                    <select id="codigoSelect" required>
                        <option value="">Carregando produtos do JSON...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="validade">Validade:</label>
                    <input type="date" id="validade" required>
                </div>

                <button type="submit" id="btnEnviar">Processar Movimentação</button>
            </form>
            <div id="mensagemStatus" class="status-msg"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
